<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sites pour commerçants</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="aslan-borek/fonts/fonts.css">
<style>
:root{--ink:#16181D;--paper:#FAFAF7;--line:#E3E1DA;--muted:#62656E;--accent:#2B59C3}
*{box-sizing:border-box;margin:0}
body{font-family:"Figtree",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
main{width:min(960px,100% - 32px);margin:72px auto}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.4rem,7vw,4rem);line-height:1;letter-spacing:-.03em}
p.intro{color:var(--muted);margin-top:16px;max-width:52ch;font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;margin-top:48px}
.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(22,24,29,.12)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover}
.card div{padding:18px 20px}
.card b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.3rem}
.card span{display:block;color:var(--muted);font-size:.95rem}
.soon{border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;min-height:240px;color:var(--muted);text-align:center;padding:24px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Sites pour commerçants</h1>
  <p class="intro">Des sites vitrines rapides et soignés pour les commerçants des marchés et du quartier.</p>
  <div class="grid">
    <a class="card" href="aslan-borek/">
      <img src="aslan-borek/img/borek-roquette.jpg" alt="" width="1024" height="682">
      <div><b>Aslan Börek</b><span>Food truck, spécialités turques</span></div>
    </a>
    <a class="card" href="buse/">
      <img src="buse/img/camion-parc.webp" alt="" width="900" height="1200" style="aspect-ratio:16/10;object-fit:cover">
      <div><b>Büse</b><span>Café ambulant, wherever you go</span></div>
    </a>
    <div class="soon">Prochain commerçant<br>bientôt ici</div>
  </div>
</main>
</body>
</html>
