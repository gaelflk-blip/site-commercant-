# Admin de Büse (Decap CMS) : modifie seulement buse/contenu.json, jamais le design.
# local_backend sert aux tests sur l'ordinateur (npx decap-server) ; il est ignoré en ligne.
locale: fr
backend:
  name: github
  repo: gaelflk-blip/site-commercant-
  branch: claude/amazing-noether-no3jhv
  commit_messages:
    update: 'Büse admin : mise à jour de {{slug}}'
local_backend: true
site_url: https://gaelflk-blip.github.io/site-commercant-/buse/
display_url: https://gaelflk-blip.github.io/site-commercant-/buse/
media_folder: buse/img/uploads
public_folder: img/uploads
collections:
- name: site
  label: Mon site
  editor:
    preview: false
  files:
  - name: contenu
    label: Carte, annonce et Instagram
    file: buse/contenu.json
    format: json
    fields:
    - label: Carte affichée
      name: saison
      widget: select
      options:
      - label: Carte d'hiver (Winter drinks)
        value: hiver
      - label: Carte normale (No beans + Specials)
        value: normale
      hint: Les cafés classiques (Coffee) restent toujours affichés.
    - label: Annonce en haut du site
      name: annonce
      widget: object
      collapsed: false
      fields:
      - label: Afficher l'annonce
        name: afficher
        widget: boolean
        default: false
      - label: Texte
        name: texte
        widget: string
        required: false
        hint: 'Ex. : Fermé ce week-end, on revient mardi !'
    - label: La carte
      name: carte
      widget: object
      collapsed: false
      fields:
      - label: Coffee (toute l'année)
        label_singular: boisson
        name: coffee
        widget: list
        summary: '{{fields.nom}} · {{fields.prix}} €'
        collapsed: true
        fields:
        - label: Nom
          name: nom
          widget: string
        - label: Prix (€)
          name: prix
          widget: number
          value_type: float
          min: 0
          step: 0.1
        - label: Détail
          name: detail
          widget: string
          required: false
          hint: 'Ex. : Espresso, lait concentré sucré'
      - label: No beans, sans café (carte normale)
        label_singular: boisson
        name: sans_cafe
        widget: list
        summary: '{{fields.nom}} · {{fields.prix}} €'
        collapsed: true
        fields:
        - label: Nom
          name: nom
          widget: string
        - label: Prix (€)
          name: prix
          widget: number
          value_type: float
          min: 0
          step: 0.1
        - label: Détail
          name: detail
          widget: string
          required: false
          hint: 'Ex. : Espresso, lait concentré sucré'
      - label: Specials (carte normale)
        label_singular: boisson
        name: specials
        widget: list
        summary: '{{fields.nom}} · {{fields.prix}} €'
        collapsed: true
        fields:
        - label: Nom
          name: nom
          widget: string
        - label: Prix (€)
          name: prix
          widget: number
          value_type: float
          min: 0
          step: 0.1
        - label: Détail
          name: detail
          widget: string
          required: false
          hint: 'Ex. : Espresso, lait concentré sucré'
      - label: Winter drinks (carte d'hiver)
        label_singular: boisson
        name: hiver
        widget: list
        summary: '{{fields.nom}} · {{fields.prix}} €'
        collapsed: true
        fields:
        - label: Nom
          name: nom
          widget: string
        - label: Prix (€)
          name: prix
          widget: number
          value_type: float
          min: 0
          step: 0.1
        - label: Détail
          name: detail
          widget: string
          required: false
          hint: 'Ex. : Espresso, lait concentré sucré'
      - label: Options (lait végétal, extra shot…)
        label_singular: option
        name: options
        widget: list
        summary: '{{fields.nom}} · +{{fields.prix}} €'
        collapsed: true
        fields:
        - label: Nom
          name: nom
          widget: string
        - label: Supplément (€)
          name: prix
          widget: number
          value_type: float
          min: 0
          step: 0.1
        - label: Détail
          name: detail
          widget: string
          required: false
        - label: Aussi pendant la carte d'hiver
          name: en_hiver
          widget: boolean
          default: true
    - label: Publications Instagram
      label_singular: publication
      name: instagram
      widget: list
      required: false
      hint: 'Dans Instagram : « … » sur la publication, puis « Copier le lien ». 3 conseillées. Une bannière cookies s''affichera sur le site.'
      summary: '{{fields.lien}}'
      fields:
      - label: Lien
        name: lien
        widget: string
        pattern:
        - ^https://(www\.)?instagram\.com/
        - Collez un lien qui commence par https://www.instagram.com/
    - label: Marchés
      label_singular: marché
      name: marches
      widget: list
      required: false
      hint: Laissez vide pour ne pas donner d'emplacement.
      summary: '{{fields.nom}} · {{fields.quand}}'
      fields:
      - label: Nom
        name: nom
        widget: string
      - label: Quand
        name: quand
        widget: string
        hint: 'Ex. : Samedi 8 h – 13 h'
      - label: Adresse (pour la carte Google)
        name: adresse
        widget: string
